<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MES 助手 · Agent</title>
<style>
  /* 设计 token 逐字取自 MES 原型 index.html:26-53（浅色）与 :55-79（暗色），不另创配色。
     取法：从原型源码提取，不凭截图目测 —— 目测出来的色值对不上，而且会随主题漂移。
     data-theme 挂在 <html> 上，由下方脚本**镜像 iframe 里 MES 的同一个属性**，
     所以 MES 那边切主题（含「跟随系统」与 data-theme-lock 强制深色的视图），这边跟着变。 */
  :root, [data-theme="light"]{
    --brand-700:#11458c; --brand-600:#1a57ad; --brand-500:#2769c6;
    --brand-200:#c4d9f9; --brand-100:#e6effc;
    --bg-page:#f3f5f7; --bg-surface:#fbfcfe; --bg-raised:#ffffff; --bg-wash:#e9ecf0;
    --border:#d9dde2; --border-strong:#c1c6cc;
    --text-0:#282f36; --text-1:#3b4249; --text-2:#5d646b; --text-muted:#7a8188;
    --success:#05893e; --success-bg:#e0f7e4;
    --warning:#965e00; --warning-bg:#fff0cc;
    --danger:#c22823;  --danger-bg:#ffebe8;
    --radius-sm:4px; --radius-md:6px; --radius-lg:8px;
    --shadow-card:0 1px 2px rgba(20,42,75,.04), 0 2px 8px rgba(20,42,75,.06);
    --focus-ring:0 0 0 3px rgba(26,87,173,.25);
    /* 主按钮的前景色：亮色主题下品牌蓝是深色，配白字 */
    --on-brand:#ffffff;
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --brand-600:#5e9ae7; --brand-500:#76afee; --brand-700:#3c79d1; --brand-100:#1e2e47;
    --bg-page:#0d1116; --bg-surface:#151a1f; --bg-raised:#1c2128; --bg-wash:#1c2128;
    --border:#2c323a; --border-strong:#3a4149;
    --text-0:#e4e8ed; --text-1:#e4e8ed; --text-2:#afb5bc; --text-muted:#838a92;
    --success:#53be70; --success-bg:#1a3520;
    --warning:#ddb049; --warning-bg:#3f3112;
    --danger:#f26b59;  --danger-bg:#462622;
    --shadow-card:0 1px 2px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.28);
    --focus-ring:0 0 0 3px rgba(94,154,231,.35);
    /* 暗色下品牌蓝是浅色，白字会发虚 —— 原型对 .btn-primary 也是这么处理的（:142） */
    --on-brand:#141b24;
  }
  :root{
    --sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",
           "Source Han Sans SC",system-ui,sans-serif;
    --mono:ui-monospace,"Cascadia Mono","Consolas",monospace;
  }
  *{box-sizing:border-box}
  /* 两栏各自独立滚动，外层永远不滚。
     🔴 三处 min-height/overflow 都不能省，少一处整条链就崩：
       · grid-template-rows:minmax(0,1fr) —— 行高必须能被压到内容以下（auto 会跟内容长）
       · #side 的 min-height:0 —— flex 列的子项默认 min-height:auto，会拒绝收缩
       · #log 的 min-height:0 —— 同上，否则 overflow:auto 根本不生效
     2026-09-28 实测：注入长内容后 #side 长到 3869px、输入框被顶出屏幕外。 */
  html,body{margin:0;height:100%;overflow:hidden}
  body{display:grid;grid-template-columns:1fr 470px;grid-template-rows:minmax(0,1fr);
       height:100vh;background:var(--bg-page);font-family:var(--sans);
       font-size:14px;line-height:1.6;color:var(--text-1)}
  ::selection{background:var(--brand-200)}
  #mes{border:0;width:100%;height:100%;background:var(--bg-surface);
       border-right:1px solid var(--border);display:block;min-height:0}
  #side{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;
        background:var(--bg-page)}
  #hd{background:var(--bg-surface);border-bottom:1px solid var(--border);
      border-top:3px solid var(--brand-600);padding:12px 18px;flex:none;
      display:flex;align-items:center;gap:10px}
  #hd .logo{width:26px;height:26px;border-radius:var(--radius-sm);background:var(--brand-600);
            color:var(--on-brand);font-size:12px;font-weight:700;display:flex;
            align-items:center;justify-content:center;flex:none;letter-spacing:.02em}
  #hd .box{min-width:0}
  #hd .t{font-size:15px;font-weight:600;color:var(--text-0);line-height:1.3}
  #hd .s{font-size:12px;color:var(--text-muted);margin-top:1px}
  #hd .s b{color:var(--brand-600);font-weight:600}
  #log{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px;
       overscroll-behavior:contain}
  .m{margin-bottom:12px}
  .m .who{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:5px;
          letter-spacing:.02em}
  .m .bd{background:var(--bg-surface);border:1px solid var(--border);
         border-radius:var(--radius-md);box-shadow:var(--shadow-card);
         padding:10px 13px;font-size:13.5px;line-height:1.65;color:var(--text-1);
         white-space:pre-wrap;word-break:break-word}
  .m.me .bd{background:var(--brand-100);border-color:var(--brand-200);color:var(--text-0)}
  .m .bd code{font-family:var(--mono);background:var(--bg-wash);color:var(--text-0);
              padding:1px 5px;border-radius:var(--radius-sm);font-size:12.5px}
  #steps{margin:-4px 0 12px}
  #steps summary{font-size:12px;font-weight:600;cursor:pointer;color:var(--text-2);
                 padding:4px 0;user-select:none}
  #steps summary:hover{color:var(--brand-600)}
  #steps .st{font-family:var(--mono);font-size:11.5px;background:var(--bg-surface);
             border:1px solid var(--border);border-left:3px solid var(--brand-500);
             border-radius:var(--radius-sm);padding:6px 10px;margin-top:6px;
             color:var(--text-2);white-space:pre-wrap;word-break:break-all}
  #foot{border-top:1px solid var(--border);padding:12px 16px;background:var(--bg-surface);
        flex:none}
  #q{width:100%;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
     padding:9px 11px;font-family:var(--sans);font-size:13.5px;color:var(--text-0);
     background:var(--bg-raised);resize:vertical;min-height:54px;line-height:1.5}
  #q::placeholder{color:var(--text-muted)}
  #q:focus{outline:none;border-color:var(--brand-500);box-shadow:var(--focus-ring)}
  #row{display:flex;gap:10px;margin-top:9px;align-items:center}
  button{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--on-brand);
         border:1px solid var(--brand-600);background:var(--brand-600);
         border-radius:var(--radius-sm);padding:7px 20px;cursor:pointer;
         transition:background-color 150ms ease,border-color 150ms ease}
  button:hover:not(:disabled){background:var(--brand-500);border-color:var(--brand-500)}
  button:focus-visible{outline:none;box-shadow:var(--focus-ring)}
  button:disabled{background:var(--bg-wash);border-color:var(--border);
                  color:var(--text-muted);cursor:wait}
  #hint{font-size:12px;color:var(--text-muted)}
  #hint.busy{color:var(--warning)}
  #quick{font-size:12px;color:var(--text-muted);margin-top:9px;line-height:2}
  #quick a{color:var(--brand-600);cursor:pointer;text-decoration:none;margin-right:12px;
           border-bottom:1px solid var(--brand-200);padding-bottom:1px}
  #quick a:hover{color:var(--brand-700);border-bottom-color:var(--brand-500)}
</style>
</head>
<body>
<iframe id="mes" src="__MES_URL__"></iframe>
<div id="side">
  <div id="hd">
    <div class="logo">AI</div>
    <div class="box">
      <div class="t">MES 助手</div>
      <div class="s">真循环智能体 · 挂在 MES 旁边 · <b>原型一行未改</b></div>
    </div>
  </div>
  <div id="log">
    <div class="m ai"><div class="who">助手</div><div class="bd">问我 MES 里的事。
比如：查某张异常单、某条工单、某台设备；按部门或状态列单子；落单前查重。

我会自己决定查什么、查几步，然后把走过的步骤摊开给你看。</div></div>
  </div>
  <div id="foot">
    <textarea id="q" placeholder="例如：生产部现在有几条待处理的异常单？"></textarea>
    <div id="row"><button id="go">问</button><span id="hint"></span></div>
    <div id="quick">
      试一下：
      <a>生产部有几条待处理的？</a>
      <a>FT-01 是什么设备？</a>
      <a>查一下 QA-20260813-002</a>
      <a>洁净间有人没戴防尘帽，帮我落一张单</a>
    </div>
  </div>
</div>
<script>
/* ── 主题同步：把 iframe 里 MES 的 <html data-theme> 镜像到本页 ──────────────
   MES 的主题真源是 <html data-theme>，取值 light|dark，由 `wm-mes-theme`
   （localStorage，三档 light/dark/system）决定，原型在 index.html:7667-7680 实现。
   本页**不自己判断该用哪档**，只镜像它最终的属性值 —— 这样「跟随系统」与
   某些视图的 data-theme-lock 强制深色都自动跟上，不必在这里重写一遍规则。

   为什么必须走反代：跨源读不到 contentDocument（8790 与 8791 是不同 origin）。
   iframe 由本服务的 /mes 反代提供 ⇒ 同源 ⇒ 下面的 contentDocument 才可读，
   且两边共用同一份 localStorage。 */
(function () {
  'use strict';
  var html = document.documentElement;
  var frame = document.getElementById('mes');

  function apply(t) { if (t) { html.setAttribute('data-theme', t); } }

  // 首屏兜底：iframe 还没加载完时先按 MES 同一套缺省序定一次，避免闪一下白/黑
  (function () {
    var t = 'dark';
    try { t = localStorage.getItem('wm-mes-theme') || 'dark'; } catch (e) { /* 隐私模式等 */ }
    if (t === 'system') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ? 'dark' : 'light';
    }
    apply(t === 'light' ? 'light' : 'dark');
  })();

  function attach() {
    var d;
    try { d = frame.contentDocument; } catch (e) { d = null; }
    if (!d || !d.documentElement) { return; }          // 跨源或被拒：兜底那份仍然生效
    apply(d.documentElement.getAttribute('data-theme'));
    if (d.documentElement.__themeObs) { return; }      // 别重复挂
    d.documentElement.__themeObs = new MutationObserver(function () {
      apply(d.documentElement.getAttribute('data-theme'));
    });
    d.documentElement.__themeObs.observe(d.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }

  if (frame.contentDocument && frame.contentDocument.readyState === 'complete') { attach(); }
  frame.addEventListener('load', attach);
})();

(function () {
  'use strict';
  var go = document.getElementById('go');
  var q = document.getElementById('q');
  var log = document.getElementById('log');
  var hint = document.getElementById('hint');

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function add(who, text, cls) {
    var d = document.createElement('div');
    d.className = 'm ' + (cls || 'ai');
    d.innerHTML = '<div class="who">' + esc(who) + '</div><div class="bd">' + esc(text) + '</div>';
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  function addSteps(calls, rounds, stopped) {
    var det = document.createElement('details');
    det.id = 'steps';
    var head = document.createElement('summary');
    head.textContent = '走了 ' + rounds + ' 轮 · 调了 ' + calls.length + ' 次工具 · 结束原因 '
      + stopped + '（点开看每一步）';
    det.appendChild(head);
    calls.forEach(function (c, i) {
      var s = document.createElement('div');
      s.className = 'st';
      var first = String(c.out || '').split('\n')[0].slice(0, 160);
      s.textContent = (i + 1) + '. ' + (c.ok ? '✓' : '✗') + ' ' + c.tool
        + '(' + JSON.stringify(c.args) + ')\n   ' + first;
      det.appendChild(s);
    });
    log.appendChild(det);
    log.scrollTop = log.scrollHeight;
  }

  function ask() {
    var t = q.value.trim();
    if (!t) { return; }
    add('你', t, 'me');
    q.value = '';
    go.disabled = true;
    hint.textContent = '思考中…（一次推理要十几秒，它可能在走好几步）';
    hint.classList.add('busy');
    fetch('/ask', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ question: t })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) {
          add('助手', '出错了：' + d.error);
        } else {
          add('助手', d.answer || '(空)');
          addSteps(d.calls || [], d.rounds || 0, d.stopped || '?');
        }
      })
      .catch(function (e) { add('助手', '请求失败：' + e.message); })
      .finally(function () {
        go.disabled = false;
        hint.textContent = '';
        hint.classList.remove('busy');
      });
  }

  go.addEventListener('click', ask);
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { ask(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll('#quick a'), function (a) {
    a.addEventListener('click', function () { q.value = a.textContent; q.focus(); });
  });
})();
</script>
</body>
</html>
